<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>同趟车，一起回 · 高保真原型 v18</title>
<style>
/* 同趟 · 信号灯语 v18
   原则：少写说明，让布局自己说话。浅色为默认，夜间档保留。
   红黄绿只用来表示车次状态；黄色实心一屏只给一个主操作。 */
:root{
  --bg:#DCE3EB; --screen:#EEF2F7; --card:#FFFFFF; --inset:#F4F7FA;
  --fg:#0E2439; --fg2:#2E4660; --sub:#5B7186; --sub2:#8D9EAF;
  --line:rgba(14,36,57,.08); --line2:rgba(14,36,57,.16);
  --brand:#F5B400; --brand-ink:#0E2439; --brand-text:#9A6F00; --brand-soft:rgba(245,180,0,.14);
  --go:#1FA971; --go-text:#0F7A4E; --stop:#E5484D; --stop-text:#C62F35; --lamp-off:rgba(14,36,57,.14);
  --plate:#1F4E9A; --map:#E3EAF2; --map-line:rgba(14,36,57,.18);
  --r:8px; --r-sm:6px;
}
html[data-theme="night"]{
  --bg:#081420; --screen:#0E2439; --card:#15304A; --inset:#1C3B58;
  --fg:#E9EEF4; --fg2:#C2D0DD; --sub:#9FB3C6; --sub2:#6F86A0;
  --line:rgba(155,176,196,.13); --line2:rgba(155,176,196,.26);
  --brand-text:#F5B400; --brand-soft:rgba(245,180,0,.12);
  --go:#3DD68C; --go-text:#3DD68C; --stop:#FF6369; --stop-text:#FF6369; --lamp-off:rgba(155,176,196,.22);
  --plate:#24539E; --map:#0B1D30; --map-line:rgba(155,176,196,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);padding:36px 28px 60px;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font-family:inherit}
.ic{display:block;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* ---------- 设计稿模式：九屏平铺 ---------- */
.board-head{max-width:1800px;margin:0 auto 26px;display:flex;align-items:center;gap:14px}
.board-head h1{font-size:20px;margin:0}
.theme{margin-left:auto;display:flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.theme button{border:0;background:transparent;color:var(--sub);padding:7px 14px;font-size:13px;cursor:pointer}
.theme button.on{background:var(--card);color:var(--fg);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:28px;max-width:1800px;margin:0 auto;align-items:flex-start}
.shot{margin:0}
.phone{width:391px;padding:8px;border-radius:52px;background:#0A1622;flex:0 0 auto}
.screen{width:375px;height:812px;border-radius:44px;overflow:hidden;background:var(--screen);color:var(--fg);
  display:flex;flex-direction:column;position:relative}
.capt{text-align:center;color:var(--sub);font-size:13px;margin-top:12px}

/* ---------- 骨架 ---------- */
.status{height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;font-size:15px;font-weight:600}
.status svg{width:66px;height:12px;stroke:currentColor;fill:none;stroke-width:1.4}
.top{padding:6px 20px 14px;flex:0 0 auto}
.top h2{font-size:26px;font-weight:700;margin:0;letter-spacing:.01em}
.nav{height:48px;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:17px;font-weight:600}
.nav .back{width:36px;height:36px;display:grid;place-items:center;color:var(--fg);cursor:pointer}
.nav .back .ic{width:22px;height:22px}
.nav .act{margin-left:auto;width:36px;height:36px;display:grid;place-items:center;color:var(--sub)}
.body{flex:1 1 auto;min-height:0;overflow:hidden;padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}
.foot{flex:0 0 auto;padding:12px 16px 30px;display:flex;gap:10px;background:var(--screen);border-top:1px solid var(--line)}
.tabbar{flex:0 0 auto;height:84px;display:flex;padding:8px 0 26px;background:var(--card);border-top:1px solid var(--line)}
.tabbar div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--sub);cursor:pointer}
.tabbar div .ic{width:24px;height:24px}
.tabbar div.on{color:var(--fg);font-weight:600}
.tabbar div.on .ic{color:var(--brand-text)}

/* ---------- 组件 ---------- */
.card{background:var(--card);border-radius:12px;border:1px solid var(--line)}
.pad{padding:16px}
.btn{height:48px;border:0;border-radius:var(--r);background:var(--brand);color:var(--brand-ink);font-size:16px;font-weight:600;
  width:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s ease,background .2s ease}
.btn:active{transform:scale(.98)}
.btn.line{background:transparent;color:var(--fg);border:1px solid var(--line2)}
.btn.danger{background:transparent;color:var(--stop-text);border:1px solid color-mix(in srgb,var(--stop) 50%,transparent)}
.btn.sm{height:32px;width:auto;padding:0 14px;font-size:13px}
.btn.joined{background:#138055;color:#fff}
.seg{display:flex;gap:8px}
.seg span{height:32px;padding:0 14px;display:flex;align-items:center;border-radius:var(--r);font-size:14px;color:var(--sub);border:1px solid var(--line2)}
.seg span.on{background:var(--fg);color:var(--screen);border-color:var(--fg);font-weight:600}
.lamp{display:inline-flex;gap:4px;align-items:center}
.lamp i{width:8px;height:8px;border-radius:50%;background:var(--lamp-off);display:block}
.lamp.r i:nth-child(1){background:var(--stop);box-shadow:0 0 6px var(--stop)}
.lamp.y i:nth-child(2){background:var(--brand);box-shadow:0 0 6px var(--brand);animation:pulse 1.6s ease-in-out infinite}
.lamp.g i:nth-child(3){background:var(--go);box-shadow:0 0 6px var(--go)}
.st{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 10px;border-radius:var(--r-sm);font-size:13px;font-weight:600;border:1px solid var(--line2)}
.st.y{border-color:rgba(245,180,0,.6);background:var(--brand-soft)}
.st.g{border-color:color-mix(in srgb,var(--go) 55%,transparent);color:var(--go-text)}
.st.r{border-color:color-mix(in srgb,var(--stop) 50%,transparent);color:var(--stop-text)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;flex:0 0 auto;
  background:#D6E0EB;color:#0E2439}
html[data-theme="night"] .av{background:#2E5170;color:#E9EEF4}
.av.me{box-shadow:0 0 0 2px var(--brand)}
.av.empty{background:transparent;border:1.5px dashed var(--line2);color:var(--sub2)}
.seats{display:flex;gap:6px}
.seats .av{width:26px;height:26px;font-size:11px}
.time{font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1}
.price{font-size:20px;font-weight:700;white-space:nowrap}
.price small{font-size:12px;font-weight:500;color:var(--sub);margin-left:2px}
.muted{color:var(--sub)}
.t13{font-size:13px}.t15{font-size:15px}
.sw{display:inline-block;vertical-align:middle;width:44px;height:26px;border-radius:13px;background:var(--go);position:relative;flex:0 0 auto}
.sw:after{content:"";position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.list .li{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border-top:1px solid var(--line);font-size:16px}
.list .li:first-child{border-top:0}
.list .li .go{margin-left:auto;color:var(--sub2)}
.list .li .go .ic{width:18px;height:18px}
.ico{width:36px;height:36px;border-radius:var(--r);background:var(--inset);display:grid;place-items:center;color:var(--fg2);flex:0 0 auto}

/* 找车 · 车次卡 */
.ride{padding:16px;display:flex;flex-direction:column;gap:12px}
.ride .r1{display:flex;align-items:baseline;gap:10px}
.ride .r1 .no{font-size:14px;color:var(--sub)}
.ride .r1 .price{margin-left:auto}
.ride .r2{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--fg2)}
.ride .r2 .seats{margin-left:auto}
.ride.full{opacity:.55}

/* 我加入的车 */
.hero{padding:18px 16px}
.hero .h{display:flex;align-items:center}
.hero .h .st{margin-left:auto}
.plate{display:inline-flex;align-items:center;height:30px;padding:0 10px;border-radius:5px;background:var(--plate);color:#fff;
  font-size:16px;font-weight:700;letter-spacing:.08em;box-shadow:inset 0 0 0 2px var(--plate),inset 0 0 0 3px rgba(255,255,255,.85)}
.map{height:132px;border-radius:var(--r);background:var(--map);position:relative;overflow:hidden}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:var(--r-sm);
  background:var(--card);border:1px solid var(--line2)}

/* 群聊 */
.chat{flex:1;min-height:0;overflow:hidden;padding:4px 16px 12px;display:flex;flex-direction:column;gap:14px}
.sys{align-self:center;font-size:12px;color:var(--sub)}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg .nm{font-size:12px;color:var(--sub);margin-bottom:4px}
.bub{background:var(--card);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:9px 12px;font-size:15px;line-height:1.5;max-width:240px}
.msg.me{flex-direction:row-reverse}
.msg.me .bub{background:var(--brand-soft);border-color:rgba(245,180,0,.35);border-radius:12px 4px 12px 12px}
.inbar{display:flex;gap:10px;align-items:center;padding:10px 16px 30px;background:var(--card);border-top:1px solid var(--line)}
.inbar .in{flex:1;height:40px;border-radius:20px;background:var(--inset);padding:0 16px;display:flex;align-items:center;color:var(--sub2);font-size:15px}

/* 行程历史 */
.sum{display:flex;padding:18px 0}
.sum div{flex:1;padding:0 18px}
.sum div + div{border-left:1px solid var(--line)}
.sum b{font-size:28px;font-weight:700}
.sum span{font-size:14px;color:var(--sub);margin-left:4px}
.month{font-size:13px;font-weight:600;color:var(--sub);padding:4px 4px 0}
.day{width:44px;text-align:center;flex:0 0 auto}
.day b{display:block;font-size:20px;line-height:1.1}
.day span{font-size:11px;color:var(--sub)}
.trip{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.trip:first-child{border-top:0}
.trip .mid{flex:1;min-width:0}
.trip .mid div:first-child{font-size:16px;font-weight:600}
.trip .end{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}

/* 评价 */
.stars{display:flex;justify-content:center;gap:12px;font-size:38px;color:var(--brand);padding:10px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips span{height:34px;padding:0 14px;display:flex;align-items:center;border-radius:17px;font-size:14px;border:1px solid var(--line2);color:var(--fg2)}
.chips span.on{background:var(--brand-soft);border-color:rgba(245,180,0,.55);color:var(--fg);font-weight:600}
.ta{height:108px;border-radius:12px;background:var(--card);border:1px solid var(--line);padding:14px;font-size:15px;color:var(--sub2)}

/* 我的 */
.stats{display:flex;padding:16px 0}
.stats div{flex:1;text-align:center}
.stats div + div{border-left:1px solid var(--line)}
.stats b{display:block;font-size:22px;font-weight:700}
.stats span{font-size:12px;color:var(--sub)}

/* 登录 */
.login{flex:1;display:flex;flex-direction:column;align-items:center;padding:70px 24px 30px}
.login h2{font-size:28px;margin:22px 0 6px;letter-spacing:.04em}
.login .tonight{width:100%;margin-top:36px}
.login .tonight .li{font-size:15px}
.login .sp{flex:1}
.login .legal{font-size:11px;color:var(--sub2);margin-top:14px}
.login .alt{margin-top:14px;font-size:15px;color:var(--fg2)}

.mk-dark{display:none}
html[data-theme="night"] .mk-dark{display:block}
html[data-theme="night"] .mk-light{display:none}
.mk-light,.mk-dark{flex:0 0 auto;filter:drop-shadow(0 10px 22px rgba(14,36,57,.22))}

/* ---------- 动效 ---------- */
@keyframes pulse{0%,100%{box-shadow:0 0 2px var(--brand)}50%{box-shadow:0 0 10px 2px var(--brand)}}
@keyframes slide{from{transform:translateX(24%);opacity:0}to{transform:none;opacity:1}}
@keyframes press{0%{transform:scale(1)}40%{transform:scale(.95)}100%{transform:scale(1)}}
.btn.joining{animation:press .2s ease}
body.app .shot.active.enter .screen{animation:slide .28s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- App 模式（手机上一屏一屏点） ---------- */
body.app{padding:0;background:var(--screen);overflow:hidden}
body.app .board-head{display:none}
body.app .row{display:block;max-width:none}
body.app .shot{display:none}
body.app .shot.active{display:block}
body.app .phone{width:100%;padding:0;border-radius:0;background:transparent}
body.app .screen{width:100%;height:100vh;height:100dvh;border-radius:0}
body.app .capt{display:none}
body.app [data-go],body.app [data-back]{cursor:pointer}
</style>
</head>

<div class="board-head">
  <h1>同趟车，一起回 · 九屏</h1>
  <div class="theme"><button data-theme-set="light" class="on">浅色</button><button data-theme-set="night">夜间</button></div>

<!-- 1 登录 -->
<figure class="shot" id="s1"><div class="phone"><div class="screen">

<script>
(function(){
  var root = document.documentElement;
  function setTheme(t){
    if (t === 'night') root.setAttribute('data-theme','night'); else root.removeAttribute('data-theme');
    document.querySelectorAll('[data-theme-set]').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-theme-set') === (t||'light')); });
  }
  if (/[?&]theme=night/.test(location.search)) setTheme('night');
  document.querySelectorAll('[data-theme-set]').forEach(function(b){
    b.addEventListener('click', function(){ setTheme(b.getAttribute('data-theme-set')); });
  });

  var mq = window.matchMedia('(max-width: 760px)');
  var shots = [].slice.call(document.querySelectorAll('.shot'));
  var stack = [];
  function app(){ return document.body.classList.contains('app'); }
  function show(id, push){
    var el = document.getElementById(id); if (!el) return;
    var cur = document.querySelector('.shot.active');
    if (push !== false){ if (cur && cur.id === id) return; if (cur) stack.push(cur.id); }
    shots.forEach(function(s){ s.classList.toggle('active', s.id === id); s.classList.remove('enter'); });
    if (cur){ void el.offsetWidth; el.classList.add('enter'); }
    try { history.replaceState(null, '', location.search + '#' + id); } catch(e){}
  }
  function sync(){
    document.body.classList.toggle('app', mq.matches);
    if (mq.matches){
      var start = (location.hash || '').slice(1);
      if (!document.getElementById(start)) start = 's1';
      stack = []; shots.forEach(function(s){ s.classList.remove('active'); });
      show(start, false);
    }
  }
  document.addEventListener('click', function(e){
    if (!app()) return;
    var go = e.target.closest('[data-go]');
    if (go && go.classList.contains('btn') && go.textContent.trim() === '加入这趟车'){
      // 加入反馈：按下 → 按钮变绿 → 状态签黄灯转绿灯 → 空座被“我”填上 → 进入「我加入的车」
      e.preventDefault();
      var ride = go.closest('.ride'), st = ride.querySelector('.st'), empty = ride.querySelector('.av.empty');
      go.classList.add('joining');
      setTimeout(function(){
        go.classList.add('joined'); go.textContent = '已加入';
        var left = ride.querySelectorAll('.av.empty').length - 1, k = left > 0 ? 'y' : 'g';
        st.className = 'st ' + k; st.innerHTML = '<span class="lamp ' + k + '"><i></i><i></i><i></i></span>' + (left > 0 ? '还差 ' + left + ' 人' : '已凑齐');
        if (empty){ empty.className = 'av me'; empty.textContent = '我'; }
      }, 160);
      setTimeout(function(){ show(go.getAttribute('data-go')); }, 720);
      return;
    }
    if (go){ e.preventDefault(); show(go.getAttribute('data-go')); return; }
    if (e.target.closest('[data-back]')){ e.preventDefault(); show(stack.pop() || 's2', false); }
  });
  if (mq.addEventListener) mq.addEventListener('change', sync); else mq.addListener(sync);
  sync();
})();
</script>
